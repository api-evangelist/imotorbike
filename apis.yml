aid: imotorbike
name: iMotorbike
description: >-
  iMotorbike is a Southeast Asian online marketplace and service platform for
  buying, selling, and servicing pre-owned motorcycles, operating across
  Malaysia and Vietnam. Sellers submit their bike details, book a free
  inspection, receive a quotation, and get paid fast, while iMotorbike handles
  loan settlement and JPJ ownership transfer on their behalf. Buyers shop
  iM Certified motorcycles backed by a 170-point inspection, a 12-month
  warranty, and a 6-day return policy, and can book test rides, inspections,
  and roadside assistance (iM Rescue) through the platform. Founded in 2017 and
  backed by 500 Global, Headline, Gobi Partners, and Endeavor Catalyst,
  iMotorbike closed a US$10M Series A in 2025 to expand across the region. The
  company runs a consumer-facing web marketplace and an internal admin
  platform; it does not publish a public developer API.
